<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Among</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }


  #container{
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    background-image: url("https://img.freepik.com/vetores-gratis/abstrato-de-chuva-de-pixel_23-2148370435.jpg?semt=ais_hybrid&w=740");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .container-among1, .container-among2, .container-among3{
    height: 300px;
    width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
  }

  .tronco{
    border-radius: 50% 50% 0px 0px;
    height: 200px;
    width: 70%;
    flex-direction: column;
    display: flex;
    justify-content: center;
    border-top: 3px solid black;
    border-left: 3px solid black;
    border-right: 3px solid black;
  }

  .olho{
    position: relative;
    background-color: dimgray;
    width: 60%;
    height: 50px;
    left: -15px;
    border-radius: 25px;
    border: 4px solid black;
  }

  .olho1{
    position: relative;
    background-color: dimgray;
    width: 60%;
    height: 50px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 25px;
    border: 4px solid black;
  }

  .olho2{
    position: relative;
    background-color: dimgray;
    width: 60%;
    height: 50px;
    right: -100px;
    border-radius: 25px;
    border: 4px solid black;
  }

  .container-pernas{
    width: 70%;
    height: 100px;
    display: flex;
    justify-content: space-between;
  }
</style>
<body>
  <div id="container">
    <div class="container-among1" style="margin-top: 200px;">
      <div class="tronco" style="background-color: aliceblue;">
        <div class="olho"></div>
      </div>
      <div class="container-pernas">
        <div class="perna1" style="height: 100%; width: 40%; background-color: aliceblue; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 4px solid black; border-left: 3px solid;"></div>
        <div class="perna2" style="height: 100%; width: 40%; background-color: aliceblue; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 3px solid black; border-left: 3px solid;"></div>
      </div>
    </div>
    <div class="container-among2">
      <div class="tronco" style="background-color: red;">
        <div class="olho1"></div>
      </div>
      <div class="container-pernas">
        <div class="perna1" style="height: 100%; width: 40%; background-color: red; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 4px solid black; border-left: 3px solid;"></div>
        <div class="perna2" style="height: 100%; width: 40%; background-color: red; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 3px solid black; border-left: 3px solid;"></div>
      </div>
    </div>
    <div class="container-among3" style="margin-top: 200px;">
      <div class="tronco" style="background-color: blue;">
        <div class="olho2"></div>
      </div>
      <div class="container-pernas">
        <div class="perna1" style="height: 100%; width: 40%; background-color: blue; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 4px solid black; border-left: 3px solid;"></div>
        <div class="perna2" style="height: 100%; width: 40%; background-color: blue; border-radius: 0px 0px 50% 40%; border-bottom: 4px solid black; border-right: 3px solid black; border-left: 3px solid;"></div>
      </div>
    </div>
  </div>
  <script>
    var audio = new Audio("./best-game-console-301284.mp3");

    document.body.addEventListener("mousemove", () => {
      if (audio.paused) {
          audio.play();
      }
    });

  </script>
</body>
</html>
